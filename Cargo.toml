[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-3.0-or-later"

[workspace.dependencies]
# internal crates
quiver-config = { path = "crates/quiver-config" }
quiver-twitch = { path = "crates/quiver-twitch" }

# async runtime + CLI
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "io-util"] }
clap = { version = "4", features = ["derive"] }

# config subsystem
serde = { version = "1", features = ["derive"] }
# preserve_order: schemars properties + generated configs keep declaration order
serde_json = { version = "1", features = ["preserve_order"] }
# role_css must serialise in config order, not HashMap order — see #108.
indexmap = { version = "2", features = ["serde"] }
ron = "0.12"
schemars = "1"

# errors + logging
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# http/ws serving (widget host)
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.7", features = ["fs"] }

# twitch chat connectivity
twitch-irc = "6"

# message filtering
regex = "1"

# content hashing (badge cache)
sha2 = "0.10"
hex = "0.4"

# helix api (badges)
reqwest = { version = "0.13", features = ["json", "query", "form"] }
tokio-tungstenite = { version = "0.28", features = ["native-tls"] }

# config hot reload
lightningcss = "=1.0.0-alpha.72"
notify = "8"
notify-debouncer-full = "0.7"
tokio-util = "0.7"
futures-util = "0.3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
